<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>经济学人双语归档 · The Economist Archiver</title>
<style>
:root {
  --fg: #1a1d22;
  --bg: #f4f5f6;
  --paper: #ffffff;
  --muted: #5b6472;
  --border: #e2e5ea;
  --hover: #f0f1f3;
  --accent: #e3120b;
  --accent-soft: #fbe9e7;
  --navy: #0b2640;
  --navy-soft: #e7ecf3;
  --mark: #fff3b0;
  --sidebar-w: 360px;
  --header-h: 60px;
  --shadow-sm: 0 1px 2px rgba(11,38,64,0.04), 0 1px 3px rgba(11,38,64,0.06);
  --shadow-md: 0 4px 12px rgba(11,38,64,0.06), 0 2px 4px rgba(11,38,64,0.04);
  --radius-sm: 6px;
  --radius-md: 10px;
  --radius-lg: 14px;
  --transition: 180ms cubic-bezier(0.16, 1, 0.3, 1);
}
@media (prefers-color-scheme: dark) {
  :root {
    --fg: #e7ecf3;
    --bg: #0b121c;
    --paper: #131c28;
    --muted: #8895a8;
    --border: #243245;
    --hover: #1a2536;
    --accent: #ff4d4f;
    --accent-soft: #2c1518;
    --navy: #79c0ff;
    --navy-soft: #1a2536;
    --mark: #4a3a00;
    --shadow-sm: 0 1px 2px rgba(0,0,0,0.4);
    --shadow-md: 0 4px 12px rgba(0,0,0,0.5);
  }
}
* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Noto Sans CJK SC", "Helvetica Neue", Arial, sans-serif;
  color: var(--fg);
  background: var(--bg);
  overflow: hidden;
}

body {
  display: flex;
  flex-direction: column;
  height: 100vh;
}

/* ========== Header ========== */
header {
  flex-shrink: 0;
  height: var(--header-h);
  background: var(--paper);
  border-bottom: 1px solid var(--border);
  padding: 0 24px;
  display: flex;
  gap: 20px;
  align-items: center;
  box-shadow: var(--shadow-sm);
  z-index: 20;
}
header .brand {
  display: flex;
  align-items: center;
  gap: 10px;
  min-width: 220px;
}
header .brand-dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-soft);
}
header h1 {
  font-size: 16px;
  font-weight: 700;
  letter-spacing: 0.02em;
  margin: 0;
  color: var(--navy);
  font-family: ui-serif, Georgia, "Times New Roman", serif;
}
header h1 .zh { color: var(--fg); }
header h1 .en { color: var(--muted); font-weight: 500; font-size: 13px; margin-left: 8px; }

#search {
  flex: 1;
  max-width: 600px;
  padding: 9px 16px 9px 38px;
  border: 1px solid var(--border);
  border-radius: 22px;
  font-size: 14px;
  background: var(--bg) url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='%235b6472' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'><circle cx='11' cy='11' r='7'/><path d='m21 21-4.35-4.35'/></svg>") no-repeat 14px center;
  color: var(--fg);
  transition: border-color var(--transition), box-shadow var(--transition);
}
#search:focus {
  outline: none;
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-soft);
}
#search::placeholder { color: var(--muted); }
#count {
  color: var(--muted);
  font-size: 12.5px;
  background: var(--hover);
  padding: 5px 12px;
  border-radius: 14px;
  font-weight: 500;
  letter-spacing: 0.02em;
  white-space: nowrap;
}

/* ========== Layout ========== */
.layout {
  flex: 1;
  display: flex;
  min-height: 0;
  overflow: hidden;
}

/* ========== Sidebar ========== */
aside {
  width: var(--sidebar-w);
  flex-shrink: 0;
  border-right: 1px solid var(--border);
  overflow-y: auto;
  overflow-x: hidden;
  -webkit-overflow-scrolling: touch;
  padding: 18px 14px 32px;
  background: var(--bg);
  scrollbar-width: thin;
}
aside::-webkit-scrollbar { width: 6px; }
aside::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
aside::-webkit-scrollbar-thumb:hover { background: var(--muted); }

/* ========== Issue Card (native <details>) ========== */
details.issue-card {
  background: var(--paper);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  margin-bottom: 12px;
  box-shadow: var(--shadow-sm);
  overflow: hidden;
  transition: box-shadow var(--transition), border-color var(--transition);
}
details.issue-card:hover { box-shadow: var(--shadow-md); }

details.issue-card > summary {
  padding: 12px 14px;
  cursor: pointer;
  font-weight: 600;
  font-size: 14px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  list-style: none;
  outline: none;
  user-select: none;
  color: var(--navy);
  background: transparent;
  transition: background var(--transition);
}
details.issue-card > summary::-webkit-details-marker { display: none; }
details.issue-card > summary::after {
  content: "▸";
  font-size: 12px;
  color: var(--muted);
  transition: transform var(--transition);
  display: inline-block;
  margin-left: 8px;
}
details.issue-card[open] > summary { background: var(--navy-soft); }
details.issue-card[open] > summary::after { transform: rotate(90deg); color: var(--navy); }
details.issue-card > summary:hover { background: var(--hover); }

.issue-summary-meta {
  display: flex;
  flex-direction: column;
  gap: 2px;
  flex: 1;
  min-width: 0;
}
.issue-summary-meta .date {
  font-family: ui-serif, Georgia, serif;
  font-size: 15px;
  letter-spacing: 0.01em;
  color: var(--navy);
}
.issue-summary-meta .count-pill {
  display: inline-block;
  font-size: 11px;
  font-weight: 500;
  color: var(--muted);
  padding: 1px 8px;
  border-radius: 10px;
  background: var(--hover);
  align-self: flex-start;
  letter-spacing: 0.04em;
}

details.issue-card > .issue-body {
  padding: 6px 0 10px;
  border-top: 1px solid var(--border);
}

/* ========== Section Pills ========== */
.section-pill {
  display: inline-block;
  font-size: 10.5px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--accent);
  background: var(--accent-soft);
  padding: 3px 10px;
  border-radius: 10px;
  margin: 10px 14px 4px;
}
.section-group {
  margin-bottom: 6px;
}

/* ========== Article Link Card ========== */
.article-link {
  display: flex;
  flex-direction: column;
  gap: 3px;
  padding: 9px 14px 9px 18px;
  margin: 1px 8px;
  color: var(--fg);
  text-decoration: none;
  cursor: pointer;
  border-left: 3px solid transparent;
  border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
  transition: background var(--transition), border-color var(--transition), transform var(--transition);
}
.article-link:hover {
  background: var(--hover);
  border-left-color: var(--muted);
}
.article-link.active {
  background: var(--accent-soft);
  border-left-color: var(--accent);
}
.article-link.active .title-main { color: var(--accent); font-weight: 600; }

.title-main {
  font-size: 13px;
  font-weight: 500;
  line-height: 1.5;
  word-break: break-word;
  color: var(--fg);
}
.title-sub {
  font-size: 11.5px;
  color: var(--muted);
  line-height: 1.4;
  word-break: break-word;
  font-style: italic;
  font-family: ui-serif, Georgia, serif;
}
.title-sub:empty,
.title-sub.hidden { display: none; }

/* ========== Main Detail ========== */
main {
  flex: 1;
  min-width: 0;
  overflow-y: auto;
  overflow-x: hidden;
  -webkit-overflow-scrolling: touch;
  padding: 36px 56px 80px;
  background: var(--paper);
  scroll-behavior: smooth;
}
main::-webkit-scrollbar { width: 8px; }
main::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
main::-webkit-scrollbar-thumb:hover { background: var(--muted); }

article {
  max-width: 780px;
  margin: 0 auto;
}

article .breadcrumb {
  font-size: 12px;
  color: var(--muted);
  margin-bottom: 18px;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}
article .breadcrumb .section-tag {
  display: inline-block;
  font-weight: 700;
  color: var(--accent);
  background: var(--accent-soft);
  padding: 2px 8px;
  border-radius: 8px;
  text-transform: none;
  font-size: 11px;
}
article .breadcrumb a {
  color: var(--navy);
  text-decoration: none;
  font-weight: 500;
  font-size: 13px;
}
article .breadcrumb a:hover { text-decoration: underline; }

article h1.zh-title {
  font-family: ui-serif, Georgia, "Noto Serif SC", "Songti SC", "SimSun", serif;
  font-size: 30px;
  font-weight: 700;
  line-height: 1.35;
  color: var(--fg);
  margin: 6px 0 8px;
  letter-spacing: 0.005em;
}
article h1.zh-title:empty,
article h1.zh-title.hidden { display: none; }

article .en-title-meta {
  font-family: ui-serif, Georgia, serif;
  font-size: 17px;
  color: var(--muted);
  font-style: italic;
  margin: 0 0 22px;
  line-height: 1.5;
}
article .en-title-meta:empty,
article .en-title-meta.hidden { display: none; }

article .meta-divider {
  border: none;
  border-top: 1px solid var(--border);
  margin: 0 0 28px;
}

article .md-body {
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Serif SC", "Source Han Serif SC", Georgia, serif;
  font-size: 16.5px;
  line-height: 1.85;
  color: var(--fg);
  word-wrap: break-word;
  overflow-wrap: break-word;
}
article .md-body > *:first-child { margin-top: 0; }
article .md-body > *:last-child { margin-bottom: 0; }

article .md-body h1, article .md-body h2, article .md-body h3, article .md-body h4 {
  font-family: ui-serif, Georgia, "Noto Serif SC", serif;
  font-weight: 700;
  color: var(--navy);
  margin: 1.8em 0 0.6em;
  line-height: 1.35;
  letter-spacing: 0.005em;
}
article .md-body h1 { font-size: 26px; }
article .md-body h2 {
  font-size: 22px;
  padding-bottom: 8px;
  border-bottom: 2px solid var(--accent);
}
article .md-body h3 { font-size: 18.5px; color: var(--fg); }
article .md-body h4 { font-size: 16.5px; color: var(--muted); }

article .md-body p {
  margin: 1em 0;
  text-align: justify;
  hyphens: auto;
}
article .md-body strong { color: var(--accent); font-weight: 700; }
article .md-body em { font-style: italic; color: var(--navy); }

article .md-body ul, article .md-body ol {
  margin: 1em 0;
  padding-left: 1.8em;
}
article .md-body li { margin: 0.4em 0; }

article .md-body blockquote {
  border-left: 4px solid var(--accent);
  background: var(--bg);
  margin: 1.6em 0;
  padding: 14px 22px;
  color: var(--muted);
  font-style: italic;
  border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
}
article .md-body blockquote p:last-child { margin-bottom: 0; }

article .md-body code {
  font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  font-size: 0.88em;
  background: var(--hover);
  padding: 1px 6px;
  border-radius: 4px;
  color: var(--accent);
}
article .md-body pre {
  background: var(--bg);
  border: 1px solid var(--border);
  padding: 16px 18px;
  border-radius: var(--radius-sm);
  overflow-x: auto;
  font-size: 14px;
  line-height: 1.6;
  margin: 1.4em 0;
}
article .md-body pre code { background: transparent; padding: 0; color: var(--fg); }

article .md-body table {
  width: 100%;
  border-collapse: collapse;
  margin: 1.8em 0;
  font-size: 14.5px;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif;
  border-radius: var(--radius-sm);
  overflow: hidden;
  border: 1px solid var(--border);
}
article .md-body thead { background: var(--navy); color: #fff; }
article .md-body th {
  padding: 12px 16px;
  text-align: left;
  font-weight: 600;
  letter-spacing: 0.04em;
  font-size: 13px;
}
article .md-body td {
  padding: 10px 16px;
  border-top: 1px solid var(--border);
  vertical-align: top;
}
article .md-body tr:nth-child(even) td { background: var(--bg); }

article .md-body hr {
  border: none;
  border-top: 1px dashed var(--border);
  margin: 2em 0;
}

article details.raw-original {
  margin: 36px 0 0;
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  background: var(--bg);
  overflow: hidden;
}
article details.raw-original > summary {
  padding: 12px 18px;
  cursor: pointer;
  font-weight: 600;
  font-size: 13.5px;
  color: var(--navy);
  list-style: none;
  outline: none;
  user-select: none;
  display: flex;
  align-items: center;
  gap: 10px;
  background: var(--paper);
  transition: background var(--transition);
}
article details.raw-original > summary::-webkit-details-marker { display: none; }
article details.raw-original > summary::before {
  content: "📄";
  font-size: 14px;
}
article details.raw-original > summary::after {
  content: "▸";
  margin-left: auto;
  font-size: 11px;
  color: var(--muted);
  transition: transform var(--transition);
}
article details.raw-original[open] > summary { background: var(--navy-soft); }
article details.raw-original[open] > summary::after { transform: rotate(90deg); color: var(--navy); }
article details.raw-original pre {
  margin: 0;
  padding: 24px 28px;
  background: var(--paper);
  border-top: 1px solid var(--border);
  white-space: pre-wrap;
  word-wrap: break-word;
  font-family: ui-serif, Georgia, "Source Han Serif SC", serif;
  font-size: 15px;
  line-height: 1.85;
  color: var(--fg);
}

mark {
  background: var(--mark);
  color: inherit;
  padding: 0 2px;
  border-radius: 2px;
  font-weight: 500;
}

.placeholder {
  color: var(--muted);
  text-align: center;
  margin-top: 12vh;
  font-style: italic;
  font-family: ui-serif, Georgia, serif;
  font-size: 16px;
}
.empty {
  color: var(--muted);
  text-align: center;
  padding: 40px 10px;
  font-size: 13px;
}

@media (max-width: 768px) {
  .layout { flex-direction: column; }
  aside { width: 100%; height: 40vh; border-right: none; border-bottom: 1px solid var(--border); }
  main { padding: 24px 20px 60px; }
  header h1 .en { display: none; }
}
</style>
</head>
<body>

<header>
  <div class="brand">
    <span class="brand-dot" aria-hidden="true"></span>
    <h1><span class="zh">经济学人双语归档</span><span class="en">The Economist Archiver</span></h1>
  </div>
  <input id="search" type="search" placeholder="输入中英文关键词 · 搜索标题 / 板块 / 摘要..." autocomplete="off" spellcheck="false">
  <span id="count"></span>
</header>

<div class="layout">
  <aside id="sidebar"></aside>
  <main id="main">
    <div class="placeholder">从左侧菜单选择一篇研报,查看深度解析</div>
  </main>
</div>

<script src="database.js"></script>

<script>
(function () {
  'use strict';

  // ---------- 数据加载 ----------
  var db = (window.economist_db || []).slice();
  db.sort(function (a, b) {
    if (a.issue_date !== b.issue_date) return a.issue_date < b.issue_date ? 1 : -1;
    return a.id < b.id ? -1 : a.id > b.id ? 1 : 0;
  });

  var $search = document.getElementById('search');
  var $sidebar = document.getElementById('sidebar');
  var $main = document.getElementById('main');
  var $count = document.getElementById('count');

  var md = (window.marked && typeof window.marked.parse === 'function')
    ? window.marked.parse.bind(window.marked)
    : (window.marked || null);

  // ---------- 状态 ----------
  var currentId = null;
  var query = '';
  var searchDebounce = null;

  // ---------- 工具 ----------
  function escapeHtml(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c];
    });
  }
  function escapeRegExp(s) { return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }

  function hasZh(a) {
    // 智能兜底:title_zh 存在且非空才算"有中文标题"
    return !!(a.title_zh && String(a.title_zh).trim());
  }

  function renderTitle(a) {
    // 智能双语标题渲染:
    //   - 有 title_zh:大字显示中文,小字显示英文
    //   - 无 title_zh:大字显示英文,小字容器彻底隐藏(不留空白字符)
    if (hasZh(a)) {
      return {
        main: '<div class="title-main">' + escapeHtml(a.title_zh) + '</div>'
             + '<div class="title-sub">' + escapeHtml(a.title || '') + '</div>',
        mainZh:  '<h1 class="zh-title">' + escapeHtml(a.title_zh) + '</h1>',
        subEn:   '<div class="en-title-meta">' + escapeHtml(a.title || '') + '</div>'
      };
    }
    return {
      main: '<div class="title-main">' + escapeHtml(a.title || '') + '</div>',
      mainZh:  '<h1 class="zh-title hidden"></h1>',
      subEn:   '<div class="en-title-meta hidden"></div>'
    };
  }

  function highlight(text) {
    var safe = escapeHtml(text);
    if (!query) return safe;
    var re = new RegExp('(' + escapeRegExp(query) + ')', 'gi');
    return safe.replace(re, '<mark>$1</mark>');
  }
  function highlightZh(text) {
    var safe = escapeHtml(text);
    if (!query) return safe;
    var re = new RegExp('(' + escapeRegExp(query) + ')', 'gi');
    return safe.replace(re, '<mark>$1</mark>');
  }

  function matchArticle(a, q) {
    if (!q) return true;
    var lq = q.toLowerCase();
    return (a.title && a.title.toLowerCase().indexOf(lq) >= 0)
        || (a.title_zh && a.title_zh.toLowerCase && a.title_zh.toLowerCase().indexOf(lq) >= 0)
        || (a.section && a.section.toLowerCase().indexOf(lq) >= 0)
        || (a.summary_md && a.summary_md.toLowerCase().indexOf(lq) >= 0);
  }

  // ---------- 侧栏渲染 ----------
  function groupByIssue(arr) {
    var groups = {};
    arr.forEach(function (a) {
      (groups[a.issue_date] = groups[a.issue_date] || []).push(a);
    });
    return Object.keys(groups).sort().reverse().map(function (d) {
      return { date: d, items: groups[d].slice().sort(function (x, y) {
        return x.id < y.id ? -1 : x.id > y.id ? 1 : 0;
      })};
    });
  }
  function groupBySection(items) {
    var g = {};
    items.forEach(function (a) { (g[a.section] = g[a.section] || []).push(a); });
    return Object.keys(g).map(function (s) { return { section: s, items: g[s] }; });
  }

  function renderSidebar() {
    var filtered = db.filter(function (a) { return matchArticle(a, query); });
    $count.textContent = filtered.length + ' / ' + db.length;
    if (filtered.length === 0) {
      $sidebar.innerHTML = '<div class="empty">无匹配文章</div>';
      return;
    }
    var issues = groupByIssue(filtered);
    var html = '';
    issues.forEach(function (iss) {
      // 默认最新一期展开,其他折叠
      var open = (iss.date === issues[0].date && !query);
      html += '<details class="issue-card"' + (open ? ' open' : '') + '>';
      html += '<summary>';
      html +=   '<span class="issue-summary-meta">';
      html +=     '<span class="date">' + escapeHtml(iss.date) + '</span>';
      html +=     '<span class="count-pill">' + iss.items.length + ' 篇</span>';
      html +=   '</span>';
      html += '</summary>';
      html += '<div class="issue-body">';
      groupBySection(iss.items).forEach(function (sec) {
        html += '<div class="section-group">';
        html +=   '<span class="section-pill">' + escapeHtml(sec.section) + '</span>';
        sec.items.forEach(function (a) {
          var active = (a.id === currentId) ? ' active' : '';
          html += '<a class="article-link' + active + '" data-id="' + escapeHtml(a.id) + '" href="#' + escapeHtml(a.id) + '">'
                + renderTitle(a).main + '</a>';
        });
        html += '</div>';
      });
      html += '</div></details>';
    });
    $sidebar.innerHTML = html;
  }

  // ---------- 详情渲染 ----------
  function renderArticle(a) {
    if (!a) {
      $main.innerHTML = '<div class="placeholder">文章不存在</div>';
      return;
    }
    var titles = renderTitle(a);
    var html = '';
    html += '<article id="art-' + escapeHtml(a.id) + '">';
    html += '<div class="breadcrumb">';
    html +=   '<span class="section-tag">' + escapeHtml(a.section) + '</span>';
    html +=   '<span>' + escapeHtml(a.issue_date) + '</span>';
    html +=   '<a href="' + escapeHtml(a.url) + '" target="_blank" rel="noopener noreferrer">原文 ↗</a>';
    html += '</div>';
    html += titles.mainZh;
    html += titles.subEn;
    html += '<hr class="meta-divider">';
    if (md && a.summary_md) {
      html += '<div class="md-body">' + md(a.summary_md) + '</div>';
    } else if (a.summary_md) {
      html += '<pre>' + escapeHtml(a.summary_md) + '</pre>';
    }
    if (a.content_raw) {
      html += '<details class="raw-original"><summary>查看英文原文</summary>'
            + '<pre>' + escapeHtml(a.content_raw) + '</pre></details>';
    }
    html += '</article>';
    $main.innerHTML = html;

    // 关键:点击置顶 + 兼容老旧浏览器
    $main.scrollTop = 0;
    try {
      $main.scrollTo({ top: 0, left: 0, behavior: 'auto' });
    } catch (e) { /* 老浏览器忽略 */ }
  }

  // ---------- 事件 ----------
  $sidebar.addEventListener('click', function (e) {
    var link = e.target.closest('.article-link');
    if (!link) return;
    e.preventDefault();
    var id = link.getAttribute('data-id');
    var a = db.find(function (x) { return x.id === id; });
    if (!a) return;
    currentId = id;
    renderArticle(a);
    renderSidebar(); // 刷新 active 高亮
  });

  // 搜索:高性能实时防抖
  $search.addEventListener('input', function (e) {
    clearTimeout(searchDebounce);
    searchDebounce = setTimeout(function () {
      query = (e.target.value || '').trim();
      if (query && currentId) {
        currentId = null;
        $main.innerHTML = '<div class="placeholder">搜索中... 共 ' + db.filter(function (a) { return matchArticle(a, query); }).length + ' 条结果</div>';
      }
      renderSidebar();
    }, 120);
  });

  // ---------- 启动 ----------
  if (db.length === 0) {
    $sidebar.innerHTML = '<div class="empty">暂无文章<br>请运行 <code>python sync_weekly.py</code></div>';
    $main.innerHTML = '<div class="empty">没有加载到任何文章数据<br>请确认 <code>database.js</code> 存在并包含 <code>window.economist_db</code></div>';
  } else {
    renderSidebar();
  }
})();
</script>
</body>
</html>
